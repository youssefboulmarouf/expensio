version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: expensio-postgres
    environment:
      POSTGRES_USER: expensio
      POSTGRES_PASSWORD: expensio
      POSTGRES_DB: expensio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: expensio-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
