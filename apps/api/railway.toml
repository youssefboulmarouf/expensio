# Railway dashboard settings:
#   Root Directory : (leave empty — deploys from repo root)
#   Build Command  : (from railway.toml)
#   Start Command  : (from railway.toml)

[build]
buildCommand = "npm run build -w packages/shared && npm run build -w apps/api"

[deploy]
startCommand = "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
